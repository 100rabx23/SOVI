<style>
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .mask-edges { -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent); mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent); }
</style>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('waveform-container');
    const barCount = 40;
    
    // Create bars
    for(let i = 0; i < barCount; i++) {
      const bar = document.createElement('div');
      bar.className = 'w-1 bg-primary rounded-t-sm transition-all duration-75';
      bar.style.height = '10%';
      // Add slight glow to center bars
      if (i > barCount/3 && i < (barCount/3)*2) {
          bar.classList.add('shadow-[0_0_4px_rgba(168,232,255,0.8)]');
          bar.classList.add('bg-primary-fixed');
      }
      container.appendChild(bar);
    }

    // Animate bars to simulate acoustic data
    const bars = container.children;
    setInterval(() => {
      for(let i = 0; i < barCount; i++) {
        // Base noise
        let height = 10 + Math.random() * 20;
        
        // Simulating data bursts in the center
        if (i > barCount/4 && i < (barCount/4)*3) {
            if (Math.random() > 0.6) {
                height += Math.random() * 60; // Data spike
            }
        }
        
        bars[i].style.height = `${height}%`;
        
        // Occasionally flicker to secondary green to indicate verified packets
        if (Math.random() > 0.95) {
            bars[i].classList.replace('bg-primary', 'bg-secondary');
            setTimeout(() => {
                if(bars[i]) bars[i].classList.replace('bg-secondary', 'bg-primary');
            }, 150);
        }
      }
    }, 100);
  });
</script></main></body></html>
