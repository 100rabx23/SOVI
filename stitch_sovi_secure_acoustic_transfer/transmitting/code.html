<script>
  document.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('waveform-container');
    const barCount = 40;
    
    for (let i = 0; i < barCount; i++) {
      const bar = document.createElement('div');
      bar.className = 'w-[2px] bg-primary/70 rounded-t-sm transition-all duration-100 ease-out';
      bar.style.height = '10%';
      container.appendChild(bar);
    }

    const bars = container.children;
    let time = 0;

    function animateWaveform() {
      time += 0.1;
      for (let i = 0; i < bars.length; i++) {
        const noise = Math.sin(time + i * 0.2) * 0.5 + 0.5; 
        const randomNoise = Math.random() * 0.3;
        const height = (noise * 60) + (randomNoise * 40) + 10; 
        
        bars[i].style.height = `${height}%`;
        
        if (height > 80) {
            bars[i].classList.replace('bg-primary/70', 'bg-secondary/90');
             bars[i].style.boxShadow = '0 0 8px rgba(125, 255, 162, 0.5)';
        } else {
            bars[i].classList.replace('bg-secondary/90', 'bg-primary/70');
            bars[i].style.boxShadow = 'none';
        }
      }
      requestAnimationFrame(animateWaveform);
    }
    
    animateWaveform();
  });
